# DeepAgent Configuration
#
# The deepagent runtime is backed by deepagents and LangGraph,
# supporting complex multi-step graph execution and human-in-the-loop (HITL) interrupts.

name: deepagent_assistant
description: Demonstrates the DeepAgent runtime powered by deepagents and LangGraph
agent_framework: deepagent

instruction_file: instructions.md
workspace_directory: workspace

provider: openai
model: gpt-4o-mini
endpoint:
  url: https://api.openai.com/v1

tools:
  - web_request
  - exec_command

# Require human approval before executing tools (LangGraph HITL interrupt)
tools_approval_required: true
