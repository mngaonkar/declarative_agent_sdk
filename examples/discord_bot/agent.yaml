# Sample agent for the Discord bot example.
#
# agent_framework picks ONE end-to-end loop (no mixing):
#   lean      → native ReAct + progressive skills  (default)
#   adk       → Google ADK Runner
#   deepagent → deepagents / LangGraph

name: discord_news_agent
description: Answers questions in Discord with tools and progressive skills

agent_framework: lean 

instruction_file: instructions.md
skills_directory: skills
workspace_directory: workspace

provider: openai
model: gpt-5.4
endpoint:
  url: https://api.openai.com/v1

# Built-in tools (lean also has Skill / list_skills / read_file / write_file / run_script).
# tavily_search needs TAVILY_API_KEY.
tools:
  - web_request
  - tavily_search
  - exec_command

# Pause before non-meta tools (exec, web, …). Meta skill tools auto-approve on lean.
tools_approval_required: true
