# Lean Agent Configuration
#
# The lean runtime provides a deliberative native ReAct loop
# with progressive skill discovery (ESP-style).

name: lean_assistant
description: Demonstrates the Lean runtime with progressive skills and tools
agent_framework: lean

instruction_file: instructions.md
skills_directory: skills
workspace_directory: workspace

provider: openai
model: gpt-4o-mini
endpoint:
  url: https://api.openai.com/v1

tools:
  - web_request
  - exec_command

# Require human approval before running tools
tools_approval_required: true
