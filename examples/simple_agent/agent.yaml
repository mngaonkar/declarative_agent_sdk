# Configuration for simple_agent
#
# Choose your runtime framework:
#   lean      → native ReAct + progressive skills (default)
#   adk       → Google ADK Runner
#   deepagent → deepagents / LangGraph
#
name: simple_assistant
description: Demonstrates direct Python invocation (synchronous and streaming)
agent_framework: lean

instruction_file: instructions.md
skills_directory: skills
workspace_directory: workspace

provider: openai
model: gpt-4o-mini
endpoint:
  url: https://api.openai.com/v1

tools:
  - web_request
  - exec_command

# Require user approval before executing system commands or web requests
tools_approval_required: true
