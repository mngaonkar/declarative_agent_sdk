name: Release

# Tag push publishes a release; manual runs just produce artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # uv.lock is gitignored, so key the cache on pyproject.toml
          # instead; the default glob matches nothing and never invalidates.
          cache-dependency-glob: pyproject.toml
      - name: Run the test suite
        run: |
          # The interpreter comes from .python-version (3.14). Without that pin,
          # requires-python = ">=3.14" lets uv pick 3.15, where several
          # dependencies have no wheels yet and fall back to source builds that
          # fail. Printed below so the log shows what actually ran.
          uv sync --extra discord --extra dev
          uv run python -V
          uv run pytest tests/ -q

  # The wheel is py3-none-any, so one build covers every platform.
  wheel:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # uv.lock is gitignored, so key the cache on pyproject.toml
          # instead; the default glob matches nothing and never invalidates.
          cache-dependency-glob: pyproject.toml
      # Wheel only. Add --sdist here if a source distribution is ever wanted.
      - name: Build wheel
        run: uv build --package declarative-agent-sdk --wheel --out-dir dist
      - name: Check the wheel carries no repo junk
        run: |
          set -euo pipefail
          if unzip -l dist/*.whl | grep -E 'uv\.lock|build\.log|Dockerfile|\.env'; then
            echo "wheel contains files that should not ship" >&2
            exit 1
          fi
          unzip -l dist/*.whl | grep -q 'declarative_agent_sdk/cli/main.py'

      # The deploy scripts are what users run on a host, so a syntax error in
      # them breaks installs without failing any Python test.
      - name: Check the deploy scripts parse
        run: |
          set -euo pipefail
          bash -n packaging/deploy/install.sh
          bash -n packaging/deploy/uninstall.sh

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.whl
            artifacts/SHA256SUMS
          generate_release_notes: true
